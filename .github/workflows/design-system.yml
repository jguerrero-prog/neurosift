name: Design System

on:
  pull_request:
    branches: [main, development]
    paths:
      - "design-system/**"
      - "src/css/**"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Docs type check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/docs/package-lock.json

      - name: Install docs dependencies
        run: npm run docs:install

      - name: Type check the docs
        run: npm run docs:check

      - name: Build the docs
        run: npm run docs:build
