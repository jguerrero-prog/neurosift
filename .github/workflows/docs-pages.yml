name: Docs Site

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design-system/docs/package-lock.json

      - name: Install docs dependencies
        run: npm run docs:install

      - name: Build the docs under the repository's path
        run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
          PUBLIC_APP_BASE: /${{ github.event.repository.name }}/app/

      # The app goes beside the docs, so the UI library pages can embed the
      # real screens. The 404 page sends deep links into the app to its root.
      - name: Install app dependencies
        run: npm ci

      - name: Build the app under the docs, at app/
        run: npm run build -- --base /${{ github.event.repository.name }}/app/

      - name: Put the app and the 404 page into the docs site
        run: |
          mkdir -p design-system/docs/dist/app
          cp -R dist/. design-system/docs/dist/app/
          cp devel/gh-pages-docs/404.html design-system/docs/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: design-system/docs/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
